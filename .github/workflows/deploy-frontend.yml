name: Deploy a m2m.seypro.net.pe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Build del frontend
        run: CI=false npm run build

      # 🧪 Test conexión FTP (opcional pero útil para debug)
      - name: Test conexión FTP
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd
          nc -vz ${{ secrets.FTP_SERVER }} 21

      - name: Subir al dominio real (mantener .htaccess)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps   # usa ftp si tu hosting no soporta TLS
          port: 21
          security: loose
          timeout: 600000
          local-dir: ./build/
          server-dir: /domains/m2m.seypro.net.pe/public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.htaccess
