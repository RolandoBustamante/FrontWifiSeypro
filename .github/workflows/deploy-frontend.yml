name: Prueba FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Crear archivo prueba
        run: |
          mkdir -p temp
          echo "Esto es una prueba de subida FTP" > temp/prueba.txt
          ls -al temp

      - name: Subir archivo a public_html del dominio correcto
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./temp/
          strip-components: 1
