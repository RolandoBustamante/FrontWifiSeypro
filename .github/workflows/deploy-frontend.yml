name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: CI=false npm run build

      - name: Crear archivo de validación
        run: echo "Deploy OK - ubicación FTP confirmada" > build/ubicacion-check.txt

      - name: Verificar archivos generados
        run: |
          echo "Contenido del directorio actual:"
          pwd
          ls -al
          echo "Contenido de la carpeta build:"
          ls -al build || echo "La carpeta build no existe"

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./build/
          server-dir: public_html/

      - name: Eliminar archivo de validación (opcional)
        run: rm build/ubicacion-check.txt || echo "Archivo no encontrado"
